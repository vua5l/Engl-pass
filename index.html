<title>English Passport · جواز الإنجليزية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="English Passport">
<meta name="theme-color" content="#F7F3EC">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%232C4A6E'/%3E%3Ccircle cx='90' cy='96' r='64' fill='%231E3550'/%3E%3Cpath d='M90 34 C 62 34, 50 64, 50 104 C 50 142, 65 162, 90 162 C 115 162, 130 142, 130 104 C 130 64, 118 34, 90 34 Z' fill='%232C4A6E'/%3E%3Cpath d='M90 66 C 74 66, 68 88, 68 112 C 68 138, 77 154, 90 154 C 103 154, 112 138, 112 112 C 112 88, 106 66, 90 66 Z' fill='%23F7F3EC'/%3E%3Ccircle cx='80' cy='54' r='4.8' fill='%23F7F3EC'/%3E%3Ccircle cx='81' cy='55' r='2.3' fill='%231E2A33'/%3E%3Ccircle cx='100' cy='54' r='4.8' fill='%23F7F3EC'/%3E%3Ccircle cx='99' cy='55' r='2.3' fill='%231E2A33'/%3E%3Cpath d='M83 63 L97 63 L90 73 Z' fill='%23F2B857'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Approved Color System (19 Oct 2026): Warm paper ground (#F7F3EC), card surface (#FFFDF8), navy (#2C4A6E) with deep sub-cards (#1E3550), terracotta (#B94A33) for primary actions & active step, gold (#F2B857) for highlights on navy. Single light look even if device is in dark mode. */
:root{
  color-scheme:light only;
  --bg:#F7F3EC; --surface:#FFFDF8; --white:#FFFFFF;
  --ink:#1E2A33; --ink-2:#3C4A58; --muted:#5A6B7C;
  --dark:#2C4A6E; --dark-2:#2C4A6E; --dark-deep:#1E3550; --dark-sub:#1E3550;
  --accent:#B94A33; --accent-soft:#F9EBE7; --accent-ink:#A8432E;
  --gray:#D5CEC2; --gray-2:#E2D9CC; --gray-3:#EFE9DF; --track:#E2D9CC;
  --line:#E2D9CC; --line-dark:#5A6B7C;
  --honey:#F2B857; --honey-soft:#FDF4E7; --honey-ink:#A8432E;
  --warn-bg:#FDF4E7; --warn-line:#E9A949;
  --ok:#2A7454; --ok-soft:#E9F5EF; --ok-ink:#2A7454; --ok-line:#C5E4D5; --ok-on-dark:#8FE0B5;
  --bad:#B94A33; --bad-soft:#F9EBE7; --bad-ink:#A8432E; --bad-line:#ECCBC4; --bad-on-dark:#FF9C8F;
  --on-dark-2:rgba(255,255,255,.8);
  --simple-bg:#E8EEF5;
  --scrim:rgba(30,42,51,.5);
  --shadow:0 18px 30px -18px rgba(44,74,110,.55);
  --f-ar:"Readex Pro","Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-en:"Quicksand","Readex Pro","Segoe UI",system-ui,sans-serif;
  --f-read:"Readex Pro","Segoe UI",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;color-scheme:light only;background:var(--bg);color:var(--ink)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ar);font-size:16px;line-height:1.6}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--honey);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.scr{padding-block:20px 130px;display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
.sm{font-size:13px}
.en{font-family:var(--f-en)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{display:inline-flex;flex:none}
.ico svg{width:100%;height:100%}

/* bilingual UI helpers: English first, small Arabic underneath */
.bi{display:flex;flex-direction:column;align-items:flex-start;gap:1px;line-height:1.25;min-width:0;text-align:right}
.bi-en{font-family:var(--f-en);font-weight:700;direction:ltr;unicode-bidi:isolate;text-align:right}
.bi-ar{font-family:var(--f-ar);font-size:.8em;font-weight:400;color:var(--muted);line-height:1.35;text-align:right}
.bi-h{display:flex;flex-direction:column;align-items:flex-start;gap:2px;line-height:1.25;text-align:right}
.bi-h>.en{font-family:var(--f-en);font-weight:700;direction:ltr;unicode-bidi:isolate}
.bi-h>small{font-family:var(--f-ar);font-size:.62em;font-weight:500;color:var(--muted);line-height:1.35}
.wel-txt .bi,.wel-txt .bi-h,.fin .bi-h,.empty .bi-h,.result>.res-msg .bi,.result>.res-sub .bi{align-items:center;text-align:center}
.result>.res-msg .bi-en,.result>.res-msg .bi-ar,.result>.res-sub .bi-en,.result>.res-sub .bi-ar{text-align:center}
.wel-txt .bi-en,.wel-txt .bi-ar{text-align:center}
.btn-bi{display:flex;flex-direction:column;align-items:center;line-height:1.15;gap:1px}
.btn-bi>.en{font-family:var(--f-en);font-weight:700;font-size:15.5px;direction:ltr}
.btn-bi>small{font-family:var(--f-ar);font-size:11.5px;font-weight:500;opacity:.9}
.btn.sm .btn-bi>.en{font-size:13.5px}
.btn.sm .btn-bi>small{font-size:10.5px}

/* Arabic explanation toggle ("اعرض بالعربي") */
.ar-wrap{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.ar-btn{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:4px 12px;border-radius:999px;border:1px solid var(--line-dark);background:var(--surface);color:var(--dark);font-family:var(--f-ar);font-size:12.5px;font-weight:600;cursor:pointer;transition:background .15s}
.ar-btn:hover,.ar-btn.on{background:var(--simple-bg);border-color:var(--dark)}
.ar-box{width:100%;padding:12px 14px;border-radius:14px;background:var(--gray-3);border:1px solid var(--line);color:var(--ink-2);font-family:var(--f-ar);font-size:14px;line-height:1.75;display:flex;flex-direction:column;gap:6px;text-align:right;direction:rtl}
.fc-back .ar-btn{background:var(--dark-sub);border-color:rgba(255,255,255,.35);color:#fff}
.fc-back .ar-box{background:var(--dark-sub);border-color:rgba(255,255,255,.16);color:#fff}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:4px 22px;border-radius:999px;border:0;background:var(--accent);color:#fff;font-size:16px;font-weight:600;cursor:pointer;text-align:center;transition:transform .12s,background .15s,color .15s}
.btn:active{transform:translateY(1px)}
.btn[disabled]{background:#D5CEC2;color:#5A6B7C;opacity:1;cursor:not-allowed}
.btn.out{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-dark)}
.btn.out[disabled]{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line);opacity:.6}
.btn.light{background:#fff;color:var(--dark)}
.btn.sm{min-height:42px;padding:3px 16px;font-size:14px}
.btn .ico{width:18px;height:18px}
.ib{width:46px;height:46px;flex:none;border:0;padding:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;position:relative;background:var(--dark);color:#fff}
.ib .ico{width:20px;height:20px}
.ib.light{background:#fff;color:var(--dark)}
.ib.sm{width:40px;height:40px}
.ib.sm .ico{width:18px;height:18px}
.badge{position:absolute;top:-3px;left:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;display:grid;place-items:center;background:var(--honey);color:var(--ink);font-size:11px;font-weight:700;line-height:1}
.link{border:0;background:none;padding:6px 2px;font-size:13px;color:var(--muted);cursor:pointer;min-height:36px}
.say{display:grid}
.ox-link{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:3px 10px;border-radius:999px;border:1px solid var(--line-dark);background:var(--surface);color:var(--dark);font-family:var(--f-en);font-size:12px;font-weight:700;text-decoration:none;direction:ltr;white-space:nowrap;transition:background .15s}
.ox-link:hover{background:var(--simple-bg)}
.fc-back .ox-link,.dict .ox-link,.qcard .ox-link{background:var(--dark-sub);border-color:rgba(255,255,255,.35);color:var(--honey)}
.audio-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:4px}
.repeat-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:var(--simple-bg);color:var(--dark);font-size:12px;font-weight:600}
.fc-back .repeat-pill{background:var(--dark-sub);color:var(--on-dark-2)}
.legal-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--accent-ink);font-size:12px;font-weight:700}
.rtimer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:16px;background:var(--simple-bg);color:var(--dark);font-size:13px;font-weight:600}
.rtimer-t{font-family:var(--f-en);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr}
.mail-plain .w{border-bottom:0;cursor:default;font-weight:inherit}
.err-analysis{width:100%;display:flex;flex-direction:column;gap:10px;text-align:right;margin-top:8px}
.err-cat{padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.err-cat-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.err-cat-h b{font-size:14.5px;color:var(--accent-ink)}
.err-cat-why{font-size:13px;color:var(--ink-2);background:var(--warn-bg);border:1px solid var(--warn-line);padding:8px 10px;border-radius:10px}
.fbk-sec{padding:12px;border-radius:14px;background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.fbk-sec.spell{background:var(--warn-bg);border-color:var(--warn-line)}
.cred-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.cred-it{padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:3px;font-size:13px}
.cred-it a{color:var(--dark);font-family:var(--f-en);font-weight:700;direction:ltr;text-align:left;text-decoration:none}

/* welcome */
.wel{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.wel-art{height:56vh;min-height:320px;max-height:480px;border-radius:0 0 36px 36px;overflow:hidden;background:linear-gradient(180deg,#1E3550 0%,var(--dark) 58%,#3B5F8A 100%)}
.wel-art svg{display:block;width:100%;height:100%}
.wel-txt{padding-top:24px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.wel-lbl{font-size:13.5px;font-weight:600;color:var(--muted)}
.wel-txt h1{font-size:26px;font-weight:700;line-height:1.35}
.wel-txt p{color:var(--ink-2);line-height:1.65;max-width:34ch;font-size:14.5px}
.wel-cta{margin-top:auto;padding-top:24px;padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
.wel-cta .btn{width:100%}

/* header */
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{width:52px;height:52px;flex:none;border-radius:50%;overflow:hidden;background:var(--simple-bg);display:flex;align-items:flex-end;justify-content:center}
.who-t{display:flex;flex-direction:column;line-height:1.3}
.who-t small{font-size:12.5px;color:var(--muted)}
.who-t b{font-size:14.5px;font-weight:700;font-family:var(--f-en)}
.who-t .who-ar{font-size:12px;color:var(--muted);font-weight:500}
.hd-act{display:flex;gap:10px}
.h1{font-size:22px;font-weight:700;line-height:1.3}
.pg-h{display:flex;flex-direction:column;gap:4px}
.pg-h p{font-size:13.5px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2{font-size:18px;font-weight:700}

/* journey */
.journey{position:relative;height:278px;flex:none;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#1E3550 0%,var(--dark) 56%,#466A94 100%);color:#fff}
.j-top{position:absolute;top:14px;right:18px;left:16px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.j-lbl{font-size:12.5px;color:var(--on-dark-2)}
.j-big{font-size:20px;font-weight:700;line-height:1.25}
.j-big small{font-size:13px;font-weight:400;color:var(--on-dark-2)}
.j-curve{position:absolute;left:0;right:0;top:72px;height:82px}
.j-curve svg{display:block;width:100%;height:82px}
.j-dot{position:absolute;border-radius:50%;background:#fff}
.j-tag{position:absolute;font-family:var(--f-en);font-size:12px;font-weight:700;color:#fff}
.j-block{position:absolute;left:10px;right:10px;bottom:10px;height:116px;padding:12px 14px;border-radius:20px;background:var(--dark-sub);display:flex;flex-direction:column;justify-content:space-between}
.j-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.j-pct{display:flex;flex-direction:column;line-height:1.2}
.j-pct b{font-size:22px;font-weight:700;font-family:var(--f-en);direction:ltr;text-align:right}
.j-pct span{font-size:12px;color:var(--on-dark-2)}
.ticket{position:relative;height:40px;padding:0 14px;border-radius:999px;background:var(--surface);color:var(--ink);display:grid;grid-template-columns:1fr 1fr;align-items:center}
.tk{display:flex;align-items:baseline;gap:5px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.tk.end{justify-content:flex-end}
.tk b{font-size:13.5px;font-weight:700;color:var(--ink);font-family:var(--f-en)}
.notch{position:absolute;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--dark-sub)}
.notch.t{top:-7px}.notch.b{bottom:-7px}

/* lesson cards */
.lcards{display:flex;flex-direction:column;gap:14px}
.lcard{position:relative;display:flex;align-items:stretch;gap:14px;min-height:94px;width:100%;padding:0 0 0 28px;border-radius:14px;border:1.5px solid var(--line-dark);background:var(--surface);color:inherit;text-align:right;cursor:pointer}
.lcard.locked{border:1px solid var(--line);cursor:default}
.l-thumb{width:100px;flex:none;border-radius:0 12.5px 12.5px 0;overflow:hidden;background:var(--simple-bg);display:flex;align-items:flex-end;justify-content:center}
.lcard.locked .l-thumb{background:var(--gray-3);align-items:center;color:var(--muted)}
.l-thumb .ico{width:34px;height:34px}
.l-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:10px 0}
.l-title{font-family:var(--f-en);font-size:17px;font-weight:700;line-height:1.25;direction:ltr;text-align:right;color:var(--ink)}
.lcard.locked .l-title{color:var(--ink-2)}
.l-sub-en{font-family:var(--f-en);font-size:12.5px;font-weight:600;color:var(--ink-2);direction:ltr;text-align:right}
.l-sub{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-size:12px;color:var(--muted)}
.chip-now{padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-size:11.5px;font-weight:600}
.chip-done{padding:2px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok-ink);font-size:11.5px;font-weight:600}
.l-go{position:absolute;left:-15px;top:50%;width:30px;height:30px;margin-top:-15px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff}
.l-go .ico{width:15px;height:15px}
.lcard.locked .l-go{background:var(--gray-3);color:var(--muted);border:1px solid var(--line)}
.lcard.locked .l-go .ico{width:13px;height:13px}

/* nav */
.nav{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 40px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)),480px);height:66px;padding:8px;border-radius:999px;background:var(--dark);display:flex;align-items:center;justify-content:space-between;gap:4px;box-shadow:var(--shadow)}
.nav-it{position:relative;height:50px;min-width:50px;padding:0;border:0;border-radius:999px;background:none;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-size:13px;font-weight:600}
.nav-it .ico{width:21px;height:21px}
.nav-it .lbl{display:none;flex-direction:column;align-items:flex-start;line-height:1.1}
.nav-it .lbl .en{font-size:13px;font-weight:700}
.nav-it .lbl small{font-size:10.5px;font-weight:500;opacity:.85}
.nav-it.on{background:var(--bg);color:var(--dark);padding:0 16px}
.nav-it.on .ico{width:20px;height:20px}
.nav-it.on .lbl{display:flex}
.nav-dot{position:absolute;top:9px;left:9px;width:9px;height:9px;border-radius:50%;background:var(--honey)}

/* lessons tab */
.stages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:14px 10px;border-radius:20px;border:1px solid var(--line);background:var(--surface)}
.stage{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-width:0}
.stage b{height:36px;min-width:62px;padding:0 14px;border-radius:999px;display:grid;place-items:center;font-family:var(--f-en);font-size:15px;font-weight:700;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted)}
.stage.on b{background:var(--dark);color:#fff;box-shadow:none}
.stage span{font-size:11.5px;color:var(--muted);line-height:1.35}
.stage.on span{color:var(--ink);font-weight:600}
.units{display:flex;flex-direction:column;gap:12px}
.unit{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.u-n{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--gray-3);color:var(--ink-2);font-family:var(--f-en);font-weight:700}
.u-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.4}
.u-t b{font-family:var(--f-en);font-size:15px;font-weight:700;direction:ltr;text-align:right;color:var(--ink)}
.u-t .u-ar{font-size:13px;font-weight:600;color:var(--ink-2)}
.u-t span{font-size:12px;color:var(--muted)}
.u-lock{width:16px;height:16px;color:var(--muted)}
.unit-open{border-radius:20px;border:1.5px solid var(--line-dark);background:var(--surface);overflow:hidden}
.uo-head{display:flex;align-items:center;gap:12px;padding:16px;background:var(--dark);color:#fff}
.uo-head .u-n{background:var(--honey);color:var(--ink)}
.uo-head .u-t b{color:#fff}
.uo-head .u-t .u-ar{color:#fff}
.uo-head .u-t span{color:var(--on-dark-2)}
.u-t .uo-en{font-family:var(--f-en);font-size:15px;font-weight:700;color:#fff;direction:ltr;text-align:right}
.uo-list{list-style:none;margin:0;padding:8px;display:flex;flex-direction:column;gap:4px}
.uo-row{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:8px 10px;border:0;border-radius:12px;background:none;text-align:right;color:inherit}
button.uo-row{cursor:pointer;background:var(--accent-soft)}
.uo-k{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--f-en);font-size:12px;font-weight:700;background:var(--gray-3);color:var(--muted)}
button.uo-row .uo-k{background:var(--accent);color:#fff}
.uo-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.uo-t b{font-family:var(--f-en);font-size:15px;font-weight:700;direction:ltr;text-align:right}
.uo-t span{font-size:12px;color:var(--muted)}

/* words tab */
.wsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wstat{padding:12px 8px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:center;display:flex;flex-direction:column;gap:2px}
.wstat b{font-family:var(--f-en);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.wstat span{font-size:11.5px;color:var(--muted);line-height:1.25}
.wlist{display:flex;flex-direction:column;gap:10px}
.wrow{border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.wrow summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;min-height:58px}
.wrow summary::-webkit-details-marker{display:none}
.w-st{width:10px;height:10px;flex:none;border-radius:50%;background:var(--gray)}
.w-st.k{background:var(--ok)} .w-st.r{background:var(--honey)}
.w-en{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.w-en b{font-family:var(--f-en);font-size:18px;font-weight:700;direction:ltr;text-align:right;color:var(--ink)}
.w-en span{font-size:12.5px;color:var(--muted)}
.w-more{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--ink-2)}
.w-ex{font-family:var(--f-en);font-weight:600;direction:ltr;text-align:left;font-size:15.5px;color:var(--ink)}
.w-tip-en{font-family:var(--f-en);font-size:13.5px;color:var(--ink-2);direction:ltr;text-align:left;line-height:1.55}

/* review tab */
.rv-hero{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px;border-radius:24px;background:var(--dark);color:#fff}
.rv-n{display:block;font-family:var(--f-en);font-size:40px;font-weight:700;line-height:1;color:var(--honey)}
.rv-l{display:block;font-size:12.5px;color:var(--on-dark-2);margin-top:4px}
.rv-list{display:flex;flex-direction:column;gap:10px}
.rv-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.rv-q{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rv-q span{font-size:12px;color:var(--muted)}
.rv-q p{font-family:var(--f-en);font-weight:600;font-size:15px;direction:ltr;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.streak{display:flex;gap:5px;flex:none}
.streak i{width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ok)}
.streak i.on{background:var(--ok)}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:30px 16px;border-radius:24px;border:1.5px dashed var(--line);background:var(--surface)}
.empty h2{font-size:19px;font-weight:700}
.empty p{color:var(--muted);max-width:32ch;font-size:14px}

/* lesson detail */
.ld{min-height:100vh;min-height:100dvh;background:var(--dark);color:#fff;display:flex;flex-direction:column}
.ld-top{padding-top:20px;display:flex;align-items:center;justify-content:space-between}
.hero{position:relative;margin-top:18px;height:268px;border-radius:20px;overflow:hidden;background:var(--gray-3);color:var(--ink)}
.hero-arcs{position:absolute;inset:0;width:100%;height:100%}
.hero-stats{position:absolute;top:10px;right:16px;left:16px;display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2)}
.hero-stats b{font-size:15px;font-weight:700;color:var(--ink);font-family:var(--f-en)}
.hero-peng{position:absolute;left:30px;bottom:0}
.hero-title{position:absolute;right:18px;top:92px;width:176px;font-family:var(--f-en);font-size:29px;font-weight:700;line-height:1.12;direction:ltr;text-align:right;color:var(--ink)}
.hero .ib{position:absolute;right:16px;bottom:16px;width:48px;height:48px;background:var(--dark)}
.ld-desc{padding-top:18px;display:flex;flex-direction:column;gap:6px}
.ld-desc h2{font-size:18px;font-weight:700;line-height:1.4}
.ld-desc .ld-en{font-family:var(--f-en);font-size:14.5px;color:#fff;direction:ltr;text-align:left;line-height:1.55}
.ld-desc p{font-size:13.5px;line-height:1.7;color:var(--on-dark-2)}
.ld-sheet{margin-top:22px;flex:1;background:var(--bg);color:var(--ink);border-radius:28px 28px 0 0;padding-top:22px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.parts{position:relative}
.parts-line,.parts-fill{position:absolute;top:21px;height:2px;border-radius:1px}
.parts-line{left:8%;right:8%;background:var(--line)}
.parts-fill{right:8%;background:var(--dark)}
.parts ol{position:relative;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}
.pstep{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:0;cursor:pointer;color:var(--muted);font-size:10.5px;width:100%;line-height:1.15;min-width:0}
.pstep-en{font-family:var(--f-en);font-weight:700;font-size:10.5px;direction:ltr;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pstep-ar{font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pstep-c{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line-dark);color:var(--line-dark);margin-bottom:2px}
.pstep-c .ico{width:19px;height:19px}
.pstep.done{color:var(--ink);font-weight:600}
.pstep.done .pstep-c{background:var(--dark);color:#fff;box-shadow:none}
.pstep.done .pstep-c .ico{width:20px;height:20px}
.pstep.cur{color:var(--ink);font-weight:700}
.pstep.cur .pstep-c{background:var(--accent);color:#fff;box-shadow:0 0 0 4px rgba(185,74,51,.22)}
.aa{font-family:var(--f-en);font-weight:700;font-size:16px;direction:ltr}
.infos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.info{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.info .ib{width:34px;height:34px;cursor:default}
.info .ib .ico{width:17px;height:17px}
.info-t{display:flex;flex-direction:column;line-height:1.25}
.info-t b{font-size:14px;font-weight:700;font-family:var(--f-en)}
.info-t small{font-size:11.5px;color:var(--muted)}
.ld-sheet>.btn{margin-top:auto}

/* player */
.pl{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.pl-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);display:flex;align-items:center;gap:14px;padding-top:16px;padding-bottom:10px}
.pbar{flex:1;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.pbar span{display:block;height:100%;border-radius:3px;background:var(--dark);transition:width .35s ease}
.pcount{flex:none;font-size:13px;font-weight:600;color:var(--muted);direction:ltr;font-variant-numeric:tabular-nums}
.pl-body{flex:1;padding-top:10px;padding-bottom:24px;display:flex;flex-direction:column;gap:16px}
.pl-foot{position:sticky;bottom:0;z-index:10;padding-top:14px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 72%,rgba(247,243,236,0));display:flex;align-items:center;gap:10px}
.pl-foot .btn{flex:1}
.pl-foot .ib.back{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-dark);width:54px;height:54px}
.st-lbl{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}
.st-lbl b{font-weight:600;color:var(--ink)}
.tag{padding:2px 10px;border-radius:999px;background:var(--simple-bg);font-size:12px;font-weight:600;color:var(--dark)}

/* intro + done */
.intro{display:flex;flex-direction:column;gap:14px;padding-top:12px}
.intro-ic{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--dark);color:#fff}
.intro-ic .ico{width:30px;height:30px}
.intro-ic .aa{font-size:26px}
.intro h1{font-size:26px;font-weight:700;line-height:1.3}
.intro .en-p{font-family:var(--f-en);font-size:16px;font-weight:600;color:var(--ink);direction:ltr;text-align:left;line-height:1.6}
.intro>p:not([class]){color:var(--ink-2);line-height:1.75;font-size:14px}
.intro ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.intro li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.intro li .ico{width:20px;height:20px;color:var(--dark)}
.fin{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding-block:24px}
.done-ic{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#fff;box-shadow:0 0 0 10px var(--ok-soft)}
.done-ic .ico{width:44px;height:44px}
.fin h1{font-size:24px;font-weight:700;line-height:1.35}
.fin p{color:var(--ink-2);max-width:34ch;line-height:1.65;font-size:14.5px}
.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}

/* question card */
.qcard{position:relative;padding:22px;border-radius:24px;background:var(--dark);color:#fff}
.qcard.top{padding-top:62px}
.q-tag{position:absolute;top:22px;right:22px;font-size:12px;color:var(--honey);font-weight:600}
.qcard .ib{position:absolute;top:14px;left:14px}
.q-en{font-family:var(--f-en);font-size:24px;font-weight:600;line-height:1.55;direction:ltr;text-align:left;overflow-wrap:anywhere}
.q-en.sm{font-size:21px}
.q-ar{font-size:18px;font-weight:600;line-height:1.65}
.q-en.struck{text-decoration:line-through;text-decoration-color:var(--bad-on-dark);text-decoration-thickness:2px}
.blank{display:inline-block;min-width:86px;padding:0 8px;border-bottom:2.5px solid rgba(255,255,255,.55);text-align:center;font-weight:700;line-height:1.3}
.blank.ok{border-color:var(--ok-on-dark);color:var(--ok-on-dark)}
.blank.bad{border-color:var(--bad-on-dark);color:var(--bad-on-dark)}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{min-height:56px;padding:8px 8px 8px 22px;border-radius:28px;border:0;box-shadow:inset 0 0 0 1.5px var(--line-dark);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:var(--f-en);font-size:19px;font-weight:700;line-height:1.35;cursor:pointer;direction:ltr;text-align:left;transition:background .15s,box-shadow .15s,opacity .2s}
.opt.long{font-size:16px;font-weight:600;border-radius:22px;padding-block:10px}
.opt.ar{font-family:var(--f-ar);direction:rtl;text-align:right;font-size:15.5px;font-weight:500;padding:8px 22px 8px 8px}
.opt.center{justify-content:center;padding:8px 14px;font-family:var(--f-ar);direction:rtl;font-size:15.5px;font-weight:600}
.o-dot{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--gray-3);color:transparent}
.o-dot .ico{width:18px;height:18px}
.opt.center .o-dot{display:none}
.opt.picked{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.opt.ok{box-shadow:inset 0 0 0 1.5px var(--ok);background:var(--ok-soft);color:var(--ok-ink)}
.opt.ok .o-dot{background:var(--ok);color:#fff}
.opt.bad{box-shadow:inset 0 0 0 1.5px var(--bad);background:var(--bad-soft);color:var(--bad-ink)}
.opt.bad .o-dot{background:var(--bad);color:#fff}
.opt.dim{opacity:.5}
.opt[disabled]{cursor:default}
.fb{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:18px;background:var(--surface);border:1.5px solid var(--ok)}
.fb.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb-ic{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#fff}
.fb-ic .ico{width:15px;height:15px}
.fb.bad .fb-ic{background:var(--bad)}
.fb-t{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.fb-t b{font-size:15px;font-weight:700;color:var(--ok-ink)}
.fb.bad .fb-t b{color:var(--bad-ink)}
.fb-t p{font-size:14px;line-height:1.65;color:var(--ink-2)}
.fb-t .fb-en{font-family:var(--f-en);font-weight:600;color:var(--ink);direction:ltr;text-align:left;line-height:1.55}
.fb-t .fb-fix{font-weight:600;color:var(--ink)}
.fb-fix bdi{font-family:var(--f-en);font-weight:700}
.fb-ev{margin-top:4px;padding:8px 10px;border-radius:10px;background:var(--gray-3);display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--muted)}
.fb-ev q{font-family:var(--f-en);font-style:italic;font-weight:600;direction:ltr;text-align:left;color:var(--ink);font-size:14px;quotes:"\201C" "\201D"}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.shake{animation:shake .35s}
.gap-in{font-family:var(--f-en);font-size:20px;font-weight:600;width:8.5em;max-width:100%;padding:2px 8px;border:0;border-bottom:2.5px solid var(--honey);background:var(--dark-sub);border-radius:8px 8px 0 0;color:#fff;text-align:center;vertical-align:baseline}
.gap-in:focus{outline:none;background:rgba(255,255,255,.2)}
.gap-in.ok{border-color:var(--ok-on-dark);color:var(--ok-on-dark)}
.gap-in.bad{border-color:var(--bad-on-dark);color:var(--bad-on-dark);text-decoration:line-through}
.verb{color:var(--on-dark-2);font-style:italic;font-size:.78em}
.b-line{min-height:52px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;direction:ltr}
.b-ph{width:100%;text-align:center;direction:ltr;font-family:var(--f-en);font-size:13.5px;color:var(--on-dark-2)}
.b-line.ok .chip{background:var(--ok-on-dark);color:var(--ink)}
.b-line.bad .chip{background:var(--bad-on-dark);color:var(--ink)}
.chip{font-family:var(--f-en);font-size:17px;font-weight:700;min-height:46px;padding:6px 16px;border-radius:999px;border:0;box-shadow:inset 0 0 0 1.5px var(--line-dark);background:var(--surface);color:var(--ink);cursor:pointer}
.b-line .chip{background:var(--surface);box-shadow:none}
.chip[disabled]{cursor:default}
.b-pool{display:flex;flex-wrap:wrap;gap:8px;direction:ltr;min-height:48px}

/* flashcards */
.fc{display:grid;perspective:1200px;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:24px}
.fc-face{grid-area:1/1;-webkit-backface-visibility:hidden;backface-visibility:hidden;transition:transform .55s cubic-bezier(.3,.7,.2,1);border-radius:24px;padding:24px 22px;min-height:360px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.fc-front{position:relative;overflow:hidden;align-items:center;text-align:center;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line-dark)}
.fc-arc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.fc-back{background:var(--dark);color:#fff;transform:rotateY(180deg)}
.fc.flip .fc-front{transform:rotateY(-180deg)}
.fc.flip .fc-back{transform:rotateY(0)}
.fc-pos{position:relative;font-family:var(--f-en);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.fc-word{position:relative;font-family:var(--f-en);font-size:44px;font-weight:700;line-height:1.1;direction:ltr;color:var(--ink)}
.fc-say{position:relative;font-size:14.5px;color:var(--muted)}
.fc-say b{color:var(--ink);font-weight:600}
.fc-hint{position:relative;font-size:12.5px;color:var(--muted);margin-top:6px}
.fc-front .ib{position:absolute;top:14px;left:14px}
.fc-ar{font-size:28px;font-weight:600;color:var(--honey);line-height:1.35}
.fc-exrow{display:flex;align-items:flex-start;gap:10px;direction:ltr}
.fc-ex{flex:1;min-width:0;font-family:var(--f-en);font-size:19px;font-weight:600;line-height:1.5;text-align:left}
.fc-exar{font-size:14.5px;color:var(--on-dark-2)}
.fc-tip{font-size:13.5px;line-height:1.7;background:var(--dark-sub);padding:10px 12px;border-radius:12px;display:flex;flex-direction:column;gap:6px}
.fc-tip-en{font-family:var(--f-en);direction:ltr;text-align:left;color:#fff;font-weight:600}
.fc-back .ib{background:#fff;color:var(--dark)}
.fc-mark{align-self:center;font-size:12.5px;padding:2px 10px;border-radius:999px;background:var(--simple-bg);color:var(--dark);font-weight:600}

/* matching */
.mt-box{display:flex;flex-direction:column;gap:14px}
.match{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.m-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.m-it{min-height:52px;padding:8px 12px;border-radius:26px;border:0;box-shadow:inset 0 0 0 1.5px var(--line-dark);background:var(--surface);color:var(--ink);font-size:15px;font-weight:600;cursor:pointer;overflow-wrap:anywhere;transition:background .15s,box-shadow .15s,opacity .3s}
.m-it.en{font-family:var(--f-en);font-size:17px;font-weight:700}
.m-it.sel{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.m-it.matched{box-shadow:inset 0 0 0 1.5px var(--ok);background:var(--ok-soft);color:var(--ok-ink);opacity:.65;cursor:default}
.m-it.miss{box-shadow:inset 0 0 0 1.5px var(--bad);background:var(--bad-soft);color:var(--bad-ink);animation:shake .35s}

/* explain */
.xp{display:flex;flex-direction:column;gap:14px}
.xp h2{font-size:24px;font-weight:700;line-height:1.3}
.xp h3{font-size:17px;font-weight:700}
.xp>p:not([class]),.xp .en-p{color:var(--ink-2);line-height:1.75}
.xp .en-p{font-family:var(--f-en);font-size:15.5px;direction:ltr;text-align:left;color:var(--ink-2)}
.x-en{font-family:var(--f-en);font-size:14px;font-weight:600;color:var(--muted);direction:ltr;text-align:right;margin-top:-10px}
.xbox{padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.xtag{align-self:flex-start;padding:3px 12px;border-radius:999px;font-size:12.5px;font-weight:700}
.xtag.s{background:var(--simple-bg);color:var(--dark)}
.xtag.c{background:var(--accent-soft);color:var(--accent-ink)}
.xen{font-family:var(--f-en);font-size:20px;font-weight:700;line-height:1.45;direction:ltr;text-align:left;color:var(--ink)}
.xar{font-size:14px;color:var(--muted)}
.uses{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:10px;color:var(--ink-2)}
.uses.en-uses{direction:ltr;text-align:left;font-family:var(--f-en);font-size:15px}
.uses li::marker{color:var(--muted);font-family:var(--f-en);font-weight:700}
.uses .xen{display:block;font-size:16.5px;margin-top:2px}
.tbl{overflow-x:auto;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.tbl table{width:100%;border-collapse:collapse;direction:ltr;font-family:var(--f-en);font-size:14.5px;font-weight:600}
.tbl th{font-family:var(--f-ar);font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:8px 10px;background:var(--gray-3);white-space:nowrap}
.tbl td{padding:9px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top;line-height:1.45}
.tbl td:first-child{color:var(--muted);font-size:12.5px;width:24%}
.hs{color:var(--dark);font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.hc{color:var(--accent-ink);background:var(--accent-soft);border-radius:4px;padding:0 3px;font-weight:700}
.formula{font-family:var(--f-en);font-size:20px;font-weight:700;direction:ltr;text-align:center;padding:14px;border-radius:18px;background:var(--dark);color:#fff}
.formula b{color:var(--honey)}
.tip{padding:12px 14px;border-radius:16px;background:var(--warn-bg);border:1px solid var(--warn-line);font-size:14.5px;line-height:1.75;color:var(--ink-2);display:flex;flex-direction:column;gap:8px}
.pairs{display:flex;flex-direction:column;gap:4px}
.yes,.no{display:flex;gap:8px;align-items:baseline;font-family:var(--f-en);font-size:16px;font-weight:600;direction:ltr;text-align:left;color:var(--ink)}
.yes::before{content:"\2713";color:var(--ok);font-weight:700;flex:none}
.no::before{content:"\2717";color:var(--bad);font-weight:700;flex:none}
.no{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--bad)}
.spell{list-style:none;margin:0;padding:0;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.spell li{display:block;padding:10px 14px;border-top:1px solid var(--line);font-size:14px;line-height:1.6;color:var(--ink-2)}
.spell li:first-child{border-top:0}
.spell .s-en{display:block;margin-top:2px;font-family:var(--f-en);font-weight:700;font-size:15.5px;color:var(--ink);direction:ltr;text-align:left}
.sigs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sig{padding:14px;border-radius:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sig.s{background:var(--simple-bg)} .sig.c{background:var(--accent-soft)}
.sig h3{font-size:14.5px;color:var(--dark);display:flex;flex-direction:column;gap:1px}
.sig.c h3{color:var(--accent-ink)}
.sig-ar{font-family:var(--f-ar);font-size:11.5px;font-weight:500;opacity:.85}
.sig ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.sig li{font-family:var(--f-en);font-size:13.5px;font-weight:700;background:var(--surface);color:var(--ink);padding:2px 10px;border-radius:999px}
.vlist{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.vlist li{font-family:var(--f-en);font-weight:700;padding:4px 12px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--line-dark);background:var(--surface);font-size:14.5px}
.vlist small{font-family:var(--f-ar);font-weight:400;color:var(--muted)}
.mist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.mist li{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:16px;background:var(--warn-bg);border:1px solid var(--warn-line)}
.mist .en-m{font-family:var(--f-en);font-size:13.5px;color:var(--ink);direction:ltr;text-align:left}
.mist p{font-size:13.5px;color:var(--ink-2)}
.sumc{padding:18px;border-radius:22px;background:var(--dark);color:#fff;display:flex;flex-direction:column;gap:12px}
.sumc h3{color:var(--honey);font-size:17px}
.sumc p{display:flex;flex-direction:column;gap:2px;line-height:1.6}
.sumc b{font-size:16.5px}
.sumc span{font-size:14px;color:var(--on-dark-2)}
.tl{width:100%;height:auto;display:block;direction:ltr}

/* reading */
.mail-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.toggle{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:14px}
.toggle input{-webkit-appearance:none;appearance:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.toggle input::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.toggle input:checked{background:var(--dark)}
.toggle input:checked::after{transform:translateX(-18px)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2)}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg::before{content:"";width:18px;height:10px;border-radius:3px}
.lg.s::before{background:var(--simple-bg);box-shadow:inset 0 0 0 1px rgba(44,74,110,.35)}
.lg.c::before{background:var(--accent-soft);box-shadow:inset 0 0 0 1px rgba(185,74,51,.45)}
.lg.t::before{outline:1.5px dashed var(--muted);outline-offset:-1px}
.hint{font-size:12.5px;color:var(--muted)}
.mail{border-radius:22px;background:var(--surface);border:1.5px solid var(--line-dark);overflow:hidden}
.mail-art svg{display:block;width:100%;height:auto}
.mail-meta{direction:ltr;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px;font-size:14px}
.mail-meta .k{display:inline-block;width:5.4em;font-family:var(--f-en);font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.mail-meta .subj{font-family:var(--f-en);font-weight:700}
.mail-body{direction:ltr;text-align:left;padding:16px 16px 20px;font-family:var(--f-read);font-size:17px;line-height:1.9;display:flex;flex-direction:column;gap:14px}
.w{cursor:pointer;border-bottom:1.5px dotted var(--muted);-webkit-tap-highlight-color:transparent}
.w.core{border-bottom:2px solid var(--dark);font-weight:600}
.w.on{background:var(--dark);color:#fff;border-bottom-color:var(--dark);border-radius:3px}
.hl-on .ps{background:var(--simple-bg);color:var(--dark);border-radius:4px;padding:0 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl-on .pc{background:var(--accent-soft);color:var(--accent-ink);box-shadow:inset 0 0 0 1px rgba(185,74,51,.45);border-radius:4px;padding:0 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl-on .pt{outline:1.5px dashed var(--muted);outline-offset:1px;border-radius:3px}
.insight{padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.insight .xen{font-size:16px}

/* quiz + rings */
.qi{display:flex;flex-direction:column;gap:16px;padding:20px;border-radius:24px;background:var(--dark);color:#fff}
.qi h1{font-size:24px;font-weight:700}
.qi p{color:var(--on-dark-2);line-height:1.65;font-size:14.5px}
.qi-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qs{padding:12px 6px;border-radius:16px;background:var(--dark-sub);text-align:center;display:flex;flex-direction:column}
.qs b{font-family:var(--f-en);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--honey)}
.qs span{font-size:11.5px;color:var(--on-dark-2)}
.result{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding-top:10px}
.ring-w{width:136px;height:136px}
.ring{width:100%;height:100%;direction:ltr}
.ring .bg{fill:none;stroke:var(--track);stroke-width:9}
.ring .fg{fill:none;stroke:var(--ok);stroke-width:9;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring .fg.low{stroke:var(--accent)}
.ring text{font-family:var(--f-en);font-weight:700;fill:var(--ink)}
.res-msg{font-size:22px;font-weight:700}
.res-sub{color:var(--ink-2);max-width:34ch;line-height:1.65;font-size:14px}
.wrongs{width:100%;display:flex;flex-direction:column;gap:8px;text-align:right}
.wrongs h3{font-size:15px}
.wl{padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.wl .xen{font-size:15.5px}
.wl .xen b{color:var(--ok-ink);background:var(--ok-soft);border-radius:4px;padding:0 3px}
.wl p{font-size:13.5px;color:var(--ink-2)}

/* writing */
.task{padding:18px;border-radius:24px;background:var(--dark);color:#fff;display:flex;flex-direction:column;gap:12px}
.task h2{font-size:17px;font-weight:700;line-height:1.5}
.task .task-en{font-family:var(--f-en);font-size:16px;font-weight:700;direction:ltr;text-align:left;color:#fff;line-height:1.5}
.task .task-ar{font-size:13.5px;color:var(--on-dark-2);line-height:1.55}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;line-height:1.5;color:var(--on-dark-2)}
.ck-t{flex:1;min-width:0;padding-top:1px}
.ck-en{display:block;font-family:var(--f-en);font-weight:700;font-size:14px;direction:ltr;text-align:left;color:#fff}
.ck-ex{display:block;font-family:var(--f-en);font-size:12.5px;font-weight:600;color:var(--honey);direction:ltr;text-align:left}
.cb{width:22px;height:22px;flex:none;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4);display:grid;place-items:center;color:var(--ink)}
.cb .ico{width:13px;height:13px}
.checks li.on{color:#fff}
.checks li.on .cb{background:var(--honey);box-shadow:none}
.used{display:flex;flex-wrap:wrap;gap:4px;direction:ltr;justify-content:flex-start;margin-top:4px}
.used span{font-family:var(--f-en);font-size:12.5px;font-weight:700;padding:0 8px;border-radius:999px;background:var(--dark-sub);color:var(--honey)}
.wt{width:100%;min-height:200px;font-family:var(--f-en);font-size:17px;font-weight:600;line-height:1.7;padding:14px 16px;border-radius:20px;border:1.5px solid var(--line-dark);background:var(--surface);color:var(--ink);resize:vertical;direction:ltr;text-align:left}
.wt:focus{outline:none;box-shadow:0 0 0 3px rgba(44,74,110,.22)}
.wcount{font-size:12.5px;color:var(--muted);margin-top:-8px;font-variant-numeric:tabular-nums}
.wbtns{display:flex;flex-wrap:wrap;gap:8px}
.wbtns .btn{flex:1 1 auto}
.fbk{padding:16px;border-radius:22px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.fbk-top{display:flex;align-items:center;gap:14px}
.fbk-top .ring-w{width:88px;height:88px;flex:none}
.fbk h3{font-size:15px;margin-bottom:6px}
.fbk ol{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:10px}
.fx{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.fx s{font-family:var(--f-en);font-weight:600;color:var(--bad-ink);direction:ltr}
.fx b{font-family:var(--f-en);color:var(--ok-ink);direction:ltr}
.fbk .why{font-size:13.5px;color:var(--ink-2)}
.fbk-corr{padding:12px;border-radius:14px;background:var(--ok-soft)}
.fbk-corr p{font-family:var(--f-en);font-weight:600;direction:ltr;text-align:left;line-height:1.75}
.fbk-next{padding:10px 12px;border-radius:12px;background:var(--warn-bg);border:1px solid var(--warn-line);font-size:14.5px}
.model{border-radius:18px;border:1px solid var(--line);background:var(--surface);padding:12px 16px}
.model summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
.model-t{direction:ltr;text-align:left;font-family:var(--f-read);font-size:16.5px;line-height:1.9;margin:10px 0 6px}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:15px}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--dark);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.err{color:var(--bad-ink);font-size:14.5px;font-weight:600}

/* sheets, dictionary, toast */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:100%;max-width:520px;max-height:88vh;overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:28px 28px 0 0;padding-top:10px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.grab{align-self:center;width:44px;height:5px;border-radius:3px;background:var(--line)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-h h2{font-size:20px;font-weight:700}
.sheet .ib.close{background:var(--gray-3);color:var(--ink)}
.rows{border-radius:18px;border:1px solid var(--line);background:var(--surface)}
.rowi{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);font-size:14px}
.rowi:first-child{border-top:0}
.rowi span{color:var(--muted)}
.rowi b{font-weight:600;text-align:left}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:12px;background:var(--surface);border:1px solid var(--line);min-width:0;text-align:center}
.day b{font-size:11px;font-weight:700}
.day span{font-size:10px;color:var(--muted);line-height:1.25}
.day.t{background:var(--warn-bg);border-color:var(--warn-line)}
.day.r{background:transparent;border-style:dashed}
.anat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.anat li{display:flex;align-items:baseline;gap:10px;font-size:13.5px}
.an-m{font-family:var(--f-en);font-weight:700;width:2.4em;flex:none;text-align:center;padding:2px 0;border-radius:8px;background:var(--gray-3);color:var(--ink)}
.an-t{color:var(--ink-2);line-height:1.6}
.an-t b{color:var(--ink);font-weight:700}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.rules li{display:flex;gap:10px;font-size:13.5px;line-height:1.65;color:var(--ink-2)}
.rules li::before{content:"";width:8px;height:8px;margin-top:8px;flex:none;border-radius:50%;background:var(--accent)}
.sync{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.goals{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:8px;color:var(--ink-2)}
.ask-log{display:flex;flex-direction:column;gap:10px}
.ask-log:empty{display:none}
.bub{padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.85;min-width:0;overflow-wrap:anywhere}
.bub.me{align-self:flex-start;max-width:88%;background:var(--dark);color:#fff}
.bub.ai{background:var(--surface);border:1px solid var(--line)}
.bub p+p,.bub p+ul,.bub p+ol,.bub ul+p,.bub ol+p{margin-top:6px}
.bub ul,.bub ol{padding-inline-start:20px;margin:4px 0}
.bub code{font-family:var(--f-en);font-weight:600;background:var(--gray-3);padding:0 5px;border-radius:4px;direction:ltr;unicode-bidi:isolate}
.ask-chips{display:flex;flex-wrap:wrap;gap:6px}
.ask-chip{border:0;box-shadow:inset 0 0 0 1.5px var(--line-dark);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13.5px;cursor:pointer;color:var(--ink);text-align:right;min-height:38px}
.ask-form{display:flex;flex-direction:column;gap:8px}
.ask-form textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:18px;border:1.5px solid var(--line-dark);background:var(--surface);color:var(--ink);resize:none;line-height:1.6}
.ask-form textarea:focus{outline:none;box-shadow:0 0 0 3px rgba(44,74,110,.22)}
.ask-form .row{display:flex;gap:8px}
.ask-form .btn{flex:1}
.fine{font-size:12px;color:var(--muted)}
.dict{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)),488px);padding:12px 12px 12px 16px;border-radius:22px;background:var(--dark);color:#fff;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.dict-t{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px}
.d-en{font-family:var(--f-en);font-size:20px;font-weight:700;direction:ltr}
.d-ar{font-size:18px;font-weight:600;color:var(--honey)}
.d-tag{width:100%;font-size:12px;color:var(--on-dark-2)}
.dict .ib{background:var(--dark-sub);width:40px;height:40px}
.dict .ib .ico{width:18px;height:18px}
.toast{position:fixed;z-index:70;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);padding:10px 18px;border-radius:999px;background:var(--ink);color:#fff;font-size:14.5px;font-weight:600;text-align:center;box-shadow:var(--shadow)}
.toast.in{animation:tin .3s ease both}
@keyframes tin{from{transform:translate(-50%,10px);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Stage 3: Segmented Tabs, Error Lab, Progress Dashboard, Express Mode & 60 Irregular Verbs */
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:5px;border-radius:999px;background:var(--gray-3);border:1px solid var(--line)}
.seg-b{min-height:42px;padding:6px 10px;border:0;border-radius:999px;background:transparent;color:var(--ink-2);font-size:13px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;text-align:center;min-width:0}
.seg-b .en{font-family:var(--f-en);font-size:13px;font-weight:700;direction:ltr;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.seg-b small{font-family:var(--f-ar);font-size:10.5px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.seg-b.on{background:var(--dark);color:#fff;box-shadow:0 4px 12px -4px rgba(44,74,110,.35)}
.seg-b.on small{color:var(--on-dark-2)}

.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qtile{display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding:13px 14px;border-radius:18px;border:1.5px solid var(--line-dark);background:var(--surface);color:var(--ink);text-align:right;cursor:pointer;min-width:0;transition:transform .12s,background .15s}
.qtile:active{transform:translateY(1px)}
.qtile.exp{background:var(--warn-bg);border-color:var(--warn-line)}
.qtile-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qtile-ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--dark);color:#fff;flex:none}
.qtile.exp .qtile-ic{background:var(--accent);color:#fff}
.qtile-ic .ico{width:17px;height:17px}
.qtile-badge{padding:2px 8px;border-radius:999px;background:var(--simple-bg);color:var(--dark);font-family:var(--f-en);font-size:11px;font-weight:700;direction:ltr;white-space:nowrap}
.qtile.exp .qtile-badge{background:var(--accent-soft);color:var(--accent-ink)}

.elab-list{display:flex;flex-direction:column;gap:12px}
.elab-card{padding:15px;border-radius:20px;border:1.5px solid var(--line-dark);background:var(--surface);display:flex;flex-direction:column;gap:10px;min-width:0}
.elab-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap}
.elab-badges{display:flex;flex-wrap:wrap;gap:5px;align-items:center}

var Q = null;

    return { src:k, prompt:x.s, opts:perm.map(function(j){ return x.opts[j]; }), a:perm.indexOf(x.a), whyEn:x.whyEn, why:x.why, tag:x.tag, errCat:x.errCat || 'tense' }; }) };
  goStep(1); }

}
function stQuizQ(n, ctl){ if (!Q) { setTimeout(function(){ goStep(0); }, 0); return h('p', {}, ''); }
  var it = Q.items[n], last = n === Q.items.length - 1;
  ctl.set(last ? 'النتيجة وتحليل الأخطاء' : 'السؤال التالي', Q.res[n] != null, last ? finishQuiz : nextStep);
  var nodes = MCQ(it, { tag:it.tag, saved:Q.res[n] != null ? { v:Q.res[n].v } : null, onAnswer:function(c, v){ Q.res[n] = { c:c, v:v }; if (c) Q.score++; else { S.mistakes['qz-' + it.src] = { s:0, t:Date.now() }; touch(); updateNav(); } ctl.set(last ? 'النتيجة وتحليل الأخطاء' : 'السؤال التالي', true, last ? finishQuiz : nextStep); } });
  return [label('Question ' + (n + 1) + ' of ' + Q.items.length, 'السؤال ' + (n + 1) + ' من ' + Q.items.length)].concat(nodes);
}
function finishQuiz(){ if (!Q) return; S.quiz.attempts = (S.quiz.attempts || 0) + 1; S.quiz.last = Q.score; S.quiz.best = Math.max(S.quiz.best || 0, Q.score); touch(); updateProgress(); nextStep(); }
function ring(v, max){ var r = 42, C = 2 * Math.PI * r, f = Math.max(0, Math.min(1, v / max));
  return h('div', { class:'ring-w', html:'<svg class="ring" viewBox="0 0 100 100" role="img" aria-label="' + v + ' من ' + max + '"><circle class="bg" cx="50" cy="50" r="' + r + '"/><circle class="fg' + (f < 0.8 ? ' low' : '') + '" cx="50" cy="50" r="' + r + '" stroke-dasharray="' + (C * f).toFixed(1) + ' ' + C.toFixed(1) + '"/><text x="50" y="52" text-anchor="middle" dominant-baseline="middle" font-size="24">' + v + '<tspan font-size="12" dx="1">/' + max + '</tspan></text></svg>' }); }

function renderErrorAnalysis(quizWrongs){
  var grouped = {};
  function addErr(cat, title, right, whyEn, whyAr){
    cat = ERR_CATS[cat] ? cat : 'tense';
    if (!grouped[cat]) grouped[cat] = [];
    grouped[cat].push({ title:title, right:right, whyEn:whyEn, whyAr:whyAr });
  }
  (quizWrongs || []).forEach(function(it){
    var pp = it.prompt.split('___');
    var full = pp.length > 1 ? pp[0] + '[' + it.opts[it.a] + ']' + pp[1] : it.prompt + ' → ' + it.opts[it.a];
    addErr(it.errCat || 'tense', full, it.opts[it.a], it.whyEn, it.why);
  });
  Object.keys(S.ans).forEach(function(id){
    var a = S.ans[id];
    if (!a || a.c) return;
    var it = ITEMS[id];
    if (!it) return;
    var x = it.x, right = '';
    if (it.type === 'mcq') right = x.opts[x.a];
    else if (it.type === 'tf') right = x.ok ? 'Correct' : x.fix;
    else if (it.type === 'rtf') right = x.a ? 'True' : 'False';
    else if (it.type === 'typing' || it.type === 'recall') right = x.ans[0];
    else if (it.type === 'builder') right = x.ans;
    addErr(it.errCat || 'tense', itemText(it), right, x.whyEn || x.spellNoteEn, x.why || x.spellNote);
  });
  var cats = Object.keys(grouped);
  if (!cats.length) {
    return h('div', { class:'err-analysis' },
      h('h3', { class:'bi-h', style:'font-size:16px' }, h('span', { class:'en', dir:'ltr' }, 'Lesson Error Analysis'), h('small', {}, 'تحليل أخطاء الدرس وأسبابها')),
      h('div', { class:'fb' }, h('span', { class:'fb-ic' }, ico('check')),
        h('div', { class:'fb-t' },
          h('b', {}, 'Zero Mistakes Across the Lesson! · لا توجد أخطاء مسجّلة في الدرس!'),
          h('p', { class:'fb-en' }, 'You distinguished Present Simple habits from Present Continuous actions and spelled the recall words accurately.'),
          arReveal('فرّقت بدقة بين المضارع البسيط والمستمر وأتقنت إملاء كلمات الاسترجاع.', false))));
  }
  return h('div', { class:'err-analysis' },
    h('h3', { class:'bi-h', style:'font-size:16px' }, h('span', { class:'en', dir:'ltr' }, 'Lesson Error Analysis (' + cats.length + ' ' + (cats.length === 1 ? 'Category' : 'Categories') + ')'), h('small', {}, 'تحليل أخطاء الدرس وأسبابها')),
    cats.map(function(cKey){
      var info = ERR_CATS[cKey] || ERR_CATS.tense, list = grouped[cKey];
      return h('div', { class:'err-cat' },
        h('div', { class:'err-cat-h' },
          biNode(info.en, info.ar),
          h('span', { class:'tag' }, h('bdi', { class:'en', dir:'ltr' }, list.length + (list.length === 1 ? ' item' : ' items')), ' · ' + (list.length === 1 ? 'سؤال' : 'أسئلة'))),
        h('div', { class:'err-cat-why' },
          h('p', { class:'en', dir:'ltr', style:'font-weight:600;color:var(--ink);text-align:left' }, 'Why it happens: ' + info.whyEn),
          arReveal(info.whyAr, false)),
        list.slice(0, 5).map(function(e){
          return h('div', { class:'wl' },
            h('p', { class:'xen' }, e.title, e.right ? [' → ', h('b', {}, e.right)] : null),
            e.whyEn ? h('p', { class:'en', dir:'ltr', style:'text-align:left;font-weight:600;color:var(--ink)' }, e.whyEn) : null,
            e.whyAr ? arReveal(e.whyAr, false) : null);
        }));
    }));
}

function stQuizResult(ctl){ if (!Q) { var b = S.quiz.last; if (b == null) { setTimeout(function(){ goStep(0); }, 0); return h('p', {}, ''); } }
  var sc = Q ? Q.score : S.quiz.last, n = D.quiz.length, pass = sc >= Math.ceil(n * 0.8);

function stPreTestQ(st, ctl){
  var pt = D.preTests && D.preTests[st.unit];
  var item = pt.items[st.qIdx];
  var saved = PT_STATE && PT_STATE.ans[st.qIdx];
  var o = {
    saved: saved,
    tag: 'Unit ' + st.unit + ' Pre-Test · Q' + (st.qIdx + 1) + '/10',
    onAnswer: function(ok, v){
      if (!PT_STATE) PT_STATE = { unit:st.unit, ans:{} };
      PT_STATE.ans[st.qIdx] = { c:ok, v:v };
      ctl.enable('التالي');
    }
  };
  var nodes;
  if (item.type === 'typing') {
    nodes = Typing(item, o, ctl);
  } else {
    if (!saved) ctl.set('التالي', false, nextStep);
    nodes = MCQ({ prompt:item.s, opts:item.opts, a:item.a, whyEn:item.whyEn, why:item.why }, o);
  }
  return [label('Pre-Test Question ' + (st.qIdx + 1) + ' of ' + pt.items.length, 'سؤال الاختبار القبلي ' + (st.qIdx + 1) + ' من ' + pt.items.length)].concat(nodes);
}

function stPreTestResult(st, ctl){
  var pt = D.preTests && D.preTests[st.unit];
  var N = pt.items.length, sc = 0;
  pt.items.forEach(function(_, idx){
    if (PT_STATE && PT_STATE.ans[idx] && PT_STATE.ans[idx].c) sc++;
  });
  var pct = Math.round((sc / N) * 100);
  var exempt = pct >= 90;
  var prev = (S.preTests && S.preTests[st.unit]) || {};
  S.preTests[st.unit] = {
    best: Math.max(prev.best || 0, sc),
    last: sc,
    exempt: !!(prev.exempt || exempt),
    at: Date.now()
  };
  touch();
  ctl.set('رجوع للدروس', true, closePlayer);
  return h('div', { class:'result' },
    ring(sc, N),
    h('div', { class:'res-msg' }, exempt
      ? biNode('Unit ' + st.unit + ' Exempted (' + pct + '% · ≥90%)!', 'أُعفيت من الوحدة ' + st.unit + ' (' + pct + '٪ — ٩٠٪ فأكثر)!')
      : biNode('Score: ' + pct + '% (Below 90% Exemption Threshold)', 'النتيجة: ' + pct + '٪ (أقل من حد الإعفاء ٩٠٪)')),
    h('div', { class:'res-sub' }, exempt
      ? biNode('You can skip Unit ' + st.unit + '! Its grammar rule will automatically return in the Consolidation Week.', 'يمكنك تخطي الوحدة ' + st.unit + '، وستعود قاعدتها للمراجعة في أسبوع التثبيت.')

}

/* ---------- Stage 5: Device JSON Backup Export & Restore ---------- */
function buildBackupPayload(){
  var data = {};
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf('english-passport.') === 0) {
        data[k] = JSON.parse(localStorage.getItem(k));
      }
    }
  } catch (e) {}
  if (!data[LS]) data[LS] = S;
  return JSON.stringify({
    app: 'English Passport · جواز الإنجليزية',
    version: 5,
    exportedAt: new Date().toISOString(),
    keys: data
  }, null, 2);
}

function downloadBackupFile(){
  var json = buildBackupPayload();
  try {
    var blob = new Blob([json], { type:'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = h('a', { href:url, download:'english-passport-backup.json' });
    doc.body.appendChild(a);
    a.click();
    setTimeout(function(){ try { doc.body.removeChild(a); URL.revokeObjectURL(url); } catch (e) {} }, 250);
    toast('Backup file downloaded (.json)! · تم تنزيل ملف النسخة الاحتياطية للجوال!');
  } catch (e) {
    toast('Use Copy Backup Text below · استخدم زر نسخ النص الاحتياطي بالأسفل');
  }
}

function restoreBackupPayload(rawJson){
  try {
    var parsed = JSON.parse(String(rawJson || '').trim());
    var keys = (parsed && parsed.keys && typeof parsed.keys === 'object') ? parsed.keys : (parsed && parsed.v ? { [LS]: parsed } : null);
    if (!keys) throw new Error('Invalid format');
    Object.keys(keys).forEach(function(k){
      if (k.indexOf('english-passport.') === 0) {
        localStorage.setItem(k, JSON.stringify(keys[k]));
      }
    });
    S = normalize(readLocal());
    saveLocal();
    updateProgress();
    closeSheet();
    render();
    toast('Backup restored successfully! · استُعيدت النسخة الاحتياطية بنجاح!');
    return true;
  } catch (e) {
    toast('Invalid backup file or JSON text. · ملف أو نص النسخة الاحتياطية غير صالح.');
    return false;
  }
}

function backupWidgetNode(){
  var ta = h('textarea', { class:'bkp-area', placeholder:'Paste backup JSON here to restore, or tap Copy/Download above…', 'aria-label':'Backup JSON · بيانات النسخة الاحتياطية' });
  var fileIn = h('input', { type:'file', accept:'.json,application/json', hidden:true });
  fileIn.addEventListener('change', function(){
    var f = fileIn.files && fileIn.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function(){ restoreBackupPayload(reader.result); };
    reader.readAsText(f);
  });
  return h('div', { class:'bkp-box' },
    biNode('Device Backup & Restore (Stage 5)', 'النسخة الاحتياطية في الجوال (تنزيل واستعادة)'),
    h('p', { class:'muted sm' }, 'Save a backup copy of your progress, Error Lab, Irregular Verbs schedule, and Cambly logs to your iPhone Files, or restore anytime. · احفظ نسخة احتياطية من تقدمك ومختبر الأخطاء وسجل كامبلي في ملفات الآيفون أو استعدها في أي وقت.'),
    h('div', { class:'wbtns' },
      h('button', { class:'btn sm', type:'button', on:{ click:downloadBackupFile } }, ico('mark'), biBtn('Download Backup (.json)', 'تنزيل نسخة احتياطية للجوال')),
      h('button', { class:'btn out sm', type:'button', on:{ click:function(){
        var j = buildBackupPayload();
        ta.value = j;
        try { navigator.clipboard.writeText(j); toast('Backup JSON copied! · نُسخ كود النسخة الاحتياطية!'); } catch (e) { toast('Backup shown in box below · ظهر الكود في المربع بالأسفل'); }
      } } }, ico('copy'), biBtn('Copy Backup Code', 'نسخ كود النسخة'))),
    ta,
    h('div', { class:'wbtns' },
      h('button', { class:'btn out sm', type:'button', on:{ click:function(){ fileIn.click(); } } }, biBtn('Restore from .json File', 'استعادة من ملف .json')),
      h('button', { class:'btn out sm', type:'button', on:{ click:function(){ if (!ta.value.trim()) { toast('Paste backup JSON in the box first · الصق كود النسخة الاحتياطية في المربع أولًا'); return; } restoreBackupPayload(ta.value); } } }, biBtn('Restore Pasted Code', 'استعادة النص الملصوق'))),
    fileIn);
}
